name: Build Windows portable EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Whisper model
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small', local_dir='model')"

      - name: Build portable application
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name VoiceTranscript --collect-all faster_whisper --collect-all av --add-data "model;model" app.py

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTranscript-portable
          path: dist/VoiceTranscript/
          retention-days: 30
